controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    kuka_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    safety_enable_controller:
      type: forward_command_controller/ForwardCommandController

    safety_estop_controller:
      type: forward_command_controller/ForwardCommandController

    safety_reset_controller:
      type: forward_command_controller/ForwardCommandController

kuka_arm_controller:
  ros__parameters:
    joints: [joint_a1, joint_a2, joint_a3, joint_a4, joint_a5, joint_a6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

safety_enable_controller:
  ros__parameters:
    interface_name: axis_enable
    joints: [safety]

safety_estop_controller:
  ros__parameters:
    interface_name: estop
    joints: [safety]

safety_reset_controller:
  ros__parameters:
    interface_name: reset
    joints: [safety]

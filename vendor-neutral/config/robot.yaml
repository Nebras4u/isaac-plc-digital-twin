robot:
  name: kr210_l150
  description: "KUKA KR210 L150 L — 4 controlled axes + 1 passive"

  all_joints:        [joint_1, joint_2, joint_3, joint_5, joint_4]
  controlled_joints: [joint_1, joint_2, joint_3, joint_4]

  limits_deg:
    joint_1: [-185.0, 185.0]
    joint_2: [-188.0,   35.0]
    joint_3: [-114.6, 143.2]
    joint_4: [-350.0, 350.0]

  isaac_path:  /World/Main_Robot_L_URDF/base_link
  isaac_scope: /World/Main_Robot_L_URDF

  joint_paths:
    joint_1: "{scope}/joints/joint_1"
    joint_2: "{scope}/joints/joint_2"
    joint_3: "{scope}/joints/joint_3"
    joint_4: "{scope}/joints/joint_4"
    joint_5: "{scope}/joints/joint_5"

  ruckig:
    control_hz: 120.0
    jump_threshold_rad: 0.30
    # حدوث لكل محور على حدة (Vel, Acc, Jerk)
    max_vel:  [6.0, 6.0, 6.0, 10.0]
    max_acc:  [20.0, 20.0, 20.0, 30.0]
    max_jerk: [400.0, 400.0, 400.0, 500.0]
    brake_acc_mult:  4.0  # بدلاً من 4x في الكود
    brake_jerk_mult: 8.0  # بدلاً من 8x في الكود

  drives:
    joint_1: {stiffness: 1000000.0,  damping: 100000.0,  max_force: 50000000.0}
    joint_2: {stiffness: 50000000.0, damping: 5000000.0, max_force: 1000000000.0}
    joint_3: {stiffness: 50000000.0, damping: 5000000.0, max_force: 1000000000.0}
    joint_4: {stiffness:  200000.0,  damping:  20000.0,  max_force:  5000000.0}
    joint_5: {stiffness:  200000.0,  damping:  20000.0,  max_force:  5000000.0}
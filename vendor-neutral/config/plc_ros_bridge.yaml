# plc_ros_bridge.yaml — PRODUCTION v4.0 (schema 2.2)

schema_version: "2.2"

plc:
  driver: tcp_json
  host: 192.168.122.98
  port: 5000
  timeout: 1.0

vars:
  ns: ""
  db: "MAIN_KUKA_KR210_L150_L"
  opcua_addr_template: '{ns}."{raw}"'

signals:
  cmd_ang:
    addr: "MainRobotLeft_CmdAng"
    type: float
    dir: read
    min: -360.0
    max: 360.0

  act_ang:
    addr: "MainRobotLeft_ActAng"
    type: float
    dir: write
    min: -360.0
    max: 360.0

  hb_counter:
    addr: "Heartbeat_Counter"
    type: int
    dir: read
    min: 0
    max: 2147483647

  hb_ack:
    addr: "ROS_Ack_Counter"
    type: int
    dir: write
    min: 0
    max: 2147483647

  cmd_ack:
    addr: "MainRobotLeft_CmdAck"
    type: bool
    dir: write

  axis_enable:
    addr: "MainRobotLeft_CmdEnable"
    type: bool
    dir: read

  estop:
    addr: "MainRobotLeft_Emergency_Stop_Active"
    type: bool
    dir: read

  velocity_scale:
    addr: "MainRobotLeft_Vlcty"
    type: float
    dir: read
    min: 0.0
    max: 1000.0

robot:
  joints: [joint_1, joint_2, joint_3, joint_4]
  cmd_ang: [cmd_ang]
  act_ang: [act_ang]
  cmd_ack: cmd_ack
  cmd_ang_topic: "/plc/cmd_ang"
  joint_states_topic: "/joint_states"

heartbeat:
  counter: hb_counter
  ack: hb_ack

publish:
  - {signal: estop,          topic: "/plc/emergency_stop", type: bool}
  - {signal: axis_enable,    topic: "/plc/axis_enable",    type: bool}
  - {signal: velocity_scale, topic: "/plc/velocity_scale", type: float}

poll_hz: 200
watchdog_timeout: 4.0
backoff_max: 30.0
warn_cooldown: 60.0

strict_types: true
strict_type_handshake: true

latency_probe: true
latency_probe_file: "/tmp/plc_latency.csv"

logging:
  level: INFO
  console: true
  to_ros: false
  file: "/workspace/plc_bridge_logs/bridge.log"
  json_file: "/workspace/plc_bridge_logs/bridge.jsonl"
  max_bytes: 10485760
  backup_count: 5

# plc_ros_bridge.yaml — PRODUCTION v4.1 (native ADS / TwinCAT 3)

schema_version: "2.3"

plc:
  driver: ads
  host: "192.168.50.1"
  local_ams_net_id: "192.168.50.2.1.1"
  ams_net_id: "111.111.111.3.1.1"
  ams_port: 851
  timeout: 1.0

vars:
  db: "GVL.MainRobotLeft"

signals:
  cmd_ang:
    addr: "CmdAng"
    type: float
    dir: read
    length: 4
    min: -360.0
    max: 360.0

  act_ang:
    addr: "ActAng"
    type: float
    dir: write
    length: 4
    min: -360.0
    max: 360.0

  cmd_ack:
    addr: "CmdAck"
    type: bool
    dir: write

  axis_enable:
    addr: "CmdEnable"
    type: bool
    dir: read

  estop:
    addr: "Emergency_Stop_Active"
    type: bool
    dir: read

  velocity_scale:
    addr: "Vlcty"
    type: float
    dir: read
    min: 0.0
    max: 1000.0

  # --- Heartbeat (إذا كانت الأسماء صحيحة في TwinCAT) ---
  hb_counter:
    addr: "GVL.Heartbeat_Counter"
    type: int
    dir: read
    min: 0
    max: 2147483647

  hb_ack:
    addr: "GVL.ROS_Ack_Counter"
    type: int
    dir: write
    min: 0
    max: 2147483647

robot:
  joints: [joint_1, joint_2, joint_3, joint_4]
  cmd_ang: [cmd_ang]
  act_ang: [act_ang]
  cmd_ack: cmd_ack
  cmd_ang_topic: "/plc/cmd_ang"
  joint_states_topic: "/joint_states"

heartbeat:
  counter: hb_counter
  ack: hb_ack

publish:
  - {signal: estop,          topic: "/plc/emergency_stop", type: bool}
  - {signal: axis_enable,    topic: "/plc/axis_enable",    type: bool}
  - {signal: velocity_scale, topic: "/plc/velocity_scale", type: float}

poll_hz: 200
watchdog_timeout: 4.0
backoff_max: 30.0
warn_cooldown: 60.0

strict_types: true
strict_type_handshake: true

latency_probe: true
latency_probe_file: "/tmp/plc_latency.csv"

logging:
  level: INFO
  console: true
  to_ros: false
  file: "/workspace/plc_bridge_logs/bridge.log"
  json_file: "/workspace/plc_bridge_logs/bridge.jsonl"
  max_bytes: 10485760
  backup_count: 5
